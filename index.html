<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Products</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css"
      integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg=="
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.css"
      integrity="sha512-phGxLIsvHFArdI7IyLjv14dchvbVkEDaH95efvAae/y2exeWBQCQDpNFbOTdV1p4/pIa/XtbuDCnfhDEIXhvGQ=="
      crossorigin="anonymous"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <section>
      <div class="product">Your Products</div>
      <div class="modalBody" id="newPhoneModal">
        <div
          class="animate__animated animate__fadeInUp bg-gradient p-4 rounded-3 d-flex flex-column gap-3"
        >
          <h1>Add New Phone</h1>
          <input
            id="phoneNameInput"
            class="form-control"
            type="text"
            placeholder="Enter Phone Name"
          />
          <input
            id="phonePriceInput"
            class="form-control"
            type="number"
            placeholder="Enter Phone Price"
          />
          <input
            id="phoneQtyInput"
            class="form-control"
            type="number"
            placeholder="Enter Phone Qty"
          />
          <div class="col-12 d-flex justify-content-between">
            <button id="save" class="btn" onclick="addNewPhone()">
              Save Phone
            </button>
            <button id="close" class="btn" onclick="closeModal()">Close</button>
          </div>
        </div>
      </div>
      <div class="editModalBody" id="editPhoneModal">
        <div
          class="animate__animated animate__fadeInUp bg-gradient p-4 rounded-3 d-flex flex-column gap-3"
        >
          <h1>Edit Phone</h1>
          <input
            id="phoneNameInputE"
            class="form-control"
            type="text"
            placeholder="Enter Phone Name"
          />
          <input
            id="phonePriceInputE"
            class="form-control"
            type="number"
            placeholder="Enter Phone Price"
          />
          <input
            id="phoneQtyInputE"
            class="form-control"
            type="number"
            placeholder="Enter Phone Qty"
          />
          <div class="col-12 d-flex justify-content-between">
            <button id="save" class="btn" onclick="editPhone()">
              Save Phone
            </button>
            <button id="close" class="btn" onclick="closeModal()">Close</button>
          </div>
        </div>
      </div>
      <div class="actionsContainer">
        <button id="btn1" class="btn" onclick="openModal()">
          Add New Phone
        </button>
        <div>
          <button onclick="showProducts()" id="btn5" class="btn">
            Show All
          </button>
        </div>
        <div class="search d-flex align-items-center">
          <input
            list="list"
            type="text"
            class="input"
            placeholder="Enter Phone Name"
          />
          <datalist id="list" class="bg-dar"> </datalist>
          <button id="btn4" class="btn" onclick="searchByName()">Search</button>
        </div>
      </div>
      <div class="table">
        <table class="table table-borderless mt-2">
          <thead>
            <tr>
              <th scope="col">#</th>
              <th scope="col">Phone Name</th>
              <th scope="col">Phone Price</th>
              <th scope="col">Phone Qty</th>
              <th scope="col">Actions</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </section>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script src="./main.js"></script>
  </body>
</html>
